<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* ===== 공통 초기화 ===== */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* ===== 전체 화면 ===== */
body {
    background: #f5f5f5;
    font-family: Arial, sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;

    height: 100vh;
}

/* ===== 로그인 카드 ===== */
.login {
    width: 400px;
    padding: 30px;

    background: white;
    border-radius: 15px;

    box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
}

/* ===== 제목 ===== */
.login h2 {
    text-align: center;
    margin-bottom: 30px;
}

/* ===== 라벨 ===== */
label {
    display: block;
    margin-bottom: 8px;
    font-weight: bold;
}

/* ===== 입력창 ===== */
input {
    width: 100%;
    height: 40px;

    padding-left: 10px;
    margin-bottom: 20px;

    border: 1px solid #ccc;
    border-radius: 5px;
}

/* ===== 버튼 ===== */
.btn {
    width: 100%;
    height: 45px;

    background: royalblue;
    color: white;

    border: none;
    border-radius: 5px;

    font-size: 18px;
    cursor: pointer;
}

/* ===== 버튼 효과 ===== */
.btn:hover {
    background: navy;
}

/* ===== 링크 ===== */
a {
    display: block;
    text-align: center;

    margin-top: 20px;

    text-decoration: none;
    color: royalblue;
    font-size: 14px;
}

a:hover {
    text-decoration: underline;
}
    </style>
</head>
<body>
<div class="login">
    <h2>Login</h2>

    <label>Username</label>
    <input type="text">

    <label>Password</label>
    <input type="password">

    <button class="but">Login</button>

    <a href="#">Forgot Password?</a>

 </div>
</body>
</html>
