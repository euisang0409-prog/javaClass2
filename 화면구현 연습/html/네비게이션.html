<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* ===== 공통 ===== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
}

/* ===== Header ===== */

header{
    height:70px;
    background:#333;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:0 40px;
}

.logo{
    color:white;
}

nav ul{
    display:flex;
    list-style:none;
    gap:30px;
}

nav a{
    color:white;
    text-decoration:none;
}

nav a:hover{
    color:orange;
}

/* ===== Hero ===== */

.hero{
    text-align:center;
    padding:60px;
}

.hero h2{
    margin-bottom:15px;
}

.hero p{
    margin-bottom:25px;
    font-size:18px;
}

.hero button{
    width:150px;
    height:45px;

    border:none;
    border-radius:8px;

    background:royalblue;
    color:white;

    cursor:pointer;
}

.hero button:hover{
    background:navy;
}

/* ===== Card ===== */

.cards{

    display:flex;

    justify-content:center;

    gap:30px;

    margin:40px;
}

.card{

    width:300px;

    background:white;

    border-radius:10px;

    box-shadow:0 0 10px rgba(0,0,0,.2);

    padding:20px;

    text-align:center;
}

.card img{

    width:100%;

    border-radius:10px;

    margin-bottom:15px;
}

.card h3{

    margin-bottom:10px;
}

.card p{

    margin-bottom:20px;
}

.card button{

    width:100px;

    height:40px;

    border:none;

    border-radius:5px;

    background:royalblue;

    color:white;

    cursor:pointer;
}

.card button:hover{

    background:navy;
}
    </style>
</head>
<body>

    <header>
        <h1 class="logo">Logo</h1>

        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact</a></li>
                <li><a href="#">Login</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <section class="hero">
            <h2>Welcome to My Website</h2>
            <p>HTML + CSS Layout Practice</p>

            <button>Learn More</button>
        </section>

        <section class="cards">

            <div class="card">
                <img src="https://via.placeholder.com/250x150" alt="HTML">
                <h3>HTML</h3>
                <p>HTML 기초를 학습합니다.</p>
                <button>Read</button>
            </div>

            <div class="card">
                <img src="https://via.placeholder.com/250x150" alt="CSS">
                <h3>CSS</h3>
                <p>CSS 레이아웃을 연습합니다.</p>
                <button>Read</button>
            </div>

            <div class="card">
                <img src="https://via.placeholder.com/250x150" alt="JavaScript">
                <h3>JavaScript</h3>
                <p>JavaScript 기초를 공부합니다.</p>
                <button>Read</button>
            </div>

        </section>

    </main>

</body>
</html>
